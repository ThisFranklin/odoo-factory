name: odoo-webapp
services:
  web:
    image: odoo:18.0
    container_name: odoo
    restart: always
    networks:
      - odoo_network
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8069:8069"
    volumes:
    # The ./odoo/server volume is where Odoo will store data that'll be uploaded
    # by users, such as images, PDF files, etc...
      - ./odoo/server:/var/lib/odoo 
      - ./odoo/config:/etc/odoo
      - ./odoo/addons:/mnt/extra-addons

  db:
    image: postgres:18-alpine
    container_name: database
    restart: always
    networks:
      - odoo_network
    env_file:
      - .env
    volumes:
      - ./postgres_db:/var/lib/postgresql

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    networks:
      - odoo_network
    ports:
      - 8080:8080
networks:
  odoo_network:
    driver: bridge